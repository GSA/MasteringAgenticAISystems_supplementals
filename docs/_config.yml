# GitHub Pages (Jekyll) configuration. See docs/README.md.
title: Mastering Agentic AI Systems — Supplementals
description: >-
  Companion material for Mastering Agentic AI Systems: study plan, slides, quizzes,
  practice exams, videos, code examples, and certification mappings for NVIDIA NCP-AAI
  and four other AI certifications.

# Change url and baseurl together if the repository moves or is forked.
url: https://gsa.github.io
baseurl: /MasteringAgenticAISystems_supplementals

# Links to files elsewhere in the repository (used as {{ site.repo_blob }}/path).
repo_blob: https://github.com/GSA/MasteringAgenticAISystems_supplementals/blob/master
repo_tree: https://github.com/GSA/MasteringAgenticAISystems_supplementals/tree/master

# Pinned so a theme release cannot change the site unannounced. To upgrade, change the tag,
# then re-check a few pages (see docs/README.md, "Publishing").
remote_theme: just-the-docs/just-the-docs@v0.12.0
plugins:
  - jekyll-remote-theme

color_scheme: light

# Visual style. Names a file in _data/themes/ (ndstudio, classic, or your own).
# See docs/STYLE.md.
theme_preset: ndstudio

# Emblem shown above the site title in the sidebar (a file in docs/). Leave empty for none.
seal: /gsa-seal.png
seal_alt: U.S. General Services Administration seal
search_enabled: true
heading_anchors: true
back_to_top: true
back_to_top_text: Back to top
# Extra menu entries that leave the site. The theme lists them after the pages; `before:` or `after:` (read by
# _includes/head_custom.html) moves one above or below the named menu item. Remove it to keep the link last.
nav_external_links:
  - title: Discussion
    url: https://github.com/GSA/MasteringAgenticAISystems_supplementals/discussions
    opens_in_new_tab: true
    before: Knowledge Graph  # menu item to sit above (our addition; the theme itself puts these last)

aux_links:
  GitHub repository: https://github.com/GSA/MasteringAgenticAISystems_supplementals
aux_links_new_tab: true
footer_content: >-
  Public domain: a work of the United States government, also dedicated worldwide under
  <a href="https://creativecommons.org/publicdomain/zero/1.0/">CC0 1.0</a>.
  Third-party links (videos, quizzes) are not covered by that dedication.

exclude:
  - README.md
  - STYLE.md
  - COHORT_DATA.md
  - Gemfile
  - Gemfile.lock
  - vendor
